<!DOCTYPE html><html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdminTown Panel - DreamTown</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="src/admin/css/admin-style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="panel-box">
    <h2>Panel Bandar Admin</h2>
    <p>Akses khas untuk pentadbir DreamTown</p><div class="stat-card" id="statsPanel">
  <h3>Statistik Pemain</h3>
  <p><strong>Jumlah Pemain:</strong> <span id="totalPlayers">...</span></p>
  <p><strong>Purata Level:</strong> <span id="avgLevel">...</span></p>
  <p><strong>Duit Tertinggi:</strong> <span id="topMoney">...</span></p>
</div>

<button class="admin-btn" onclick="tambahDuitSemua()">Tambah 100 Duit Kepada Semua</button>
<button class="admin-btn" onclick="naikkanLevelSemua()">Naikkan Semua Pemain ke Level 5</button>
<button class="admin-btn" onclick="resetXpSemua()">Reset XP Semua Pemain</button>
<button class="admin-btn" onclick="logoutAdmin()">Logout</button>

  </div>  <!-- Spinner & Toast -->  <div id="toast" class="toast">Notifikasi</div>
  <div id="spinner" class="spinner" style="display: none;"></div>  <!-- Script Admin Panel -->  <script type="module" src="src/js/admin/admin-panel.js"></script>  <script>
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    function toggleSpinner(show) {
      const spinner = document.getElementById("spinner");
      spinner.style.display = show ? "block" : "none";
    }

    function logoutAdmin() {
      import("https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js").then(({ getAuth, signOut }) => {
        const auth = getAuth();
        signOut(auth).then(() => {
          showToast("Anda telah logout.");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        });
      });
    }

    // Statistik Pemain
    import("https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js").then(({ getDatabase, ref, get }) => {
      const db = getDatabase();
      const statsPanel = document.getElementById("statsPanel");

      get(ref(db, "players")).then(snapshot => {
        if (snapshot.exists()) {
          const players = snapshot.val();
          const total = Object.keys(players).length;
          let totalLevel = 0, topMoney = 0;

          for (const uid in players) {
            const p = players[uid];
            totalLevel += (p.level || 1);
            if ((p.money || 0) > topMoney) topMoney = p.money;
          }

          document.getElementById("totalPlayers").textContent = total;
          document.getElementById("avgLevel").textContent = (totalLevel / total).toFixed(1);
          document.getElementById("topMoney").textContent = topMoney;
        } else {
          statsPanel.style.display = "none";
        }
      });
    });
  </script></body>
</html>
