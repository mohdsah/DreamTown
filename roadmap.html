
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreamTown Upgrade Roadmap</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    h2 {
      color: #333;
    }
    section {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <h1>DreamTown: Upgrade Roadmap</h1>

  <section>
    <h2>Fasa 1: Stabil & Optimum</h2>
    <label><input type="checkbox"> Preloader dengan progress bar</label>
    <label><input type="checkbox"> Kompres gambar & audio (WebP & OGG)</label>
    <label><input type="checkbox"> Lazy load untuk aset besar</label>
    <label><input type="checkbox"> Cache aset dan data tempatan</label>
    <label><input type="checkbox"> Optimasi loading dan scene</label>
  </section>

  <section>
    <h2>Fasa 2: Sistem Permainan Lanjutan</h2>
    <label><input type="checkbox"> Sistem Quest harian & mingguan</label>
    <label><input type="checkbox"> Sistem Rare Item (drop/event)</label>
    <label><input type="checkbox"> Topup sebenar (eWallet/FPX)</label>
    <label><input type="checkbox"> Jual beli antara pemain</label>
    <label><input type="checkbox"> Sistem Farm lanjutan</label>
  </section>

  <section>
    <h2>Fasa 3: Multiplayer & Komuniti</h2>
    <label><input type="checkbox"> Chat langsung antara pemain</label>
    <label><input type="checkbox"> Lawat bandar jiran</label>
    <label><input type="checkbox"> Leaderboard dan ranking</label>
    <label><input type="checkbox"> Event global (cuaca, boss raid)</label>
  </section>

  <section>
    <h2>Fasa 4: Kawalan Admin & Monetisasi</h2>
    <label><input type="checkbox"> Statistik pengguna</label>
    <label><input type="checkbox"> Hantar notifikasi global</label>
    <label><input type="checkbox"> Kawal event dari admin</label>
    <label><input type="checkbox"> Promosi item/ads dalam game</label>
  </section>

</body>
</html>
