<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DreamTown</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 30px; background: #eef; }
    .btn { padding: 10px 20px; margin: 6px; }
    h2 { color: #003366; }
  </style>
</head>
<body>
  <h2>Selamat datang ke DreamTown!</h2>
  <p>XP: <span id="xp">0</span></p>
  <p>Duit: <span id="money">0</span></p>
  <p>Level: <span id="level">1</span></p>

  <button class="btn" id="gainXpBtn">Tambah XP</button>
  <button class="btn" id="earnMoneyBtn">Tambah Duit</button>

  <h3>Farming & Resources</h3>
  <button class="btn" onclick="addResource('Padi', 5)">Tani Padi +5</button>
  <button class="btn" onclick="addResource('Sayur', 5)">Tani Sayur +5</button>
  <button class="btn" onclick="addResource('Kayu', 5)">Kumpul Kayu +5</button>
  <button class="btn" onclick="addResource('Kristal', 1)">Cari Kristal +1</button>

<hr>
<h2>Marketplace</h2>
<select id="sellItem">
  <option value="Padi">Padi</option>
  <option value="Sayur">Sayur</option>
  <option value="Kayu">Kayu</option>
  <option value="Kristal">Kristal</option>
</select>
<input type="number" id="sellQty" placeholder="Qty" />
<input type="number" id="sellPrice" placeholder="Harga (RM)" />
<button id="sellBtn">Jual</button>

<h3>Senarai Jualan Pemain</h3>
<table border="1">
  <thead>
    <tr>
      <th>Item</th>
      <th>Qty</th>
      <th>Harga</th>
      <th>Tindakan</th>
    </tr>
  </thead>
  <tbody id="marketList"></tbody>
</table>
  
  
  <p>Padi: <span id="padiCount">0</span></p>
  <p>Sayur: <span id="sayurCount">0</span></p>
  <p>Kayu: <span id="kayuCount">0</span></p>
  <p>Kristal: <span id="kristalCount">0</span></p>

  <!-- Firebase SDK & Main Logic -->
  <script type="module" src="main.js"></script>
  <script type="module" src="src/js/daily-quest.js"></script>
<script type="module" src="src/js/firebase-game.js"></script>
</body>
</html>
