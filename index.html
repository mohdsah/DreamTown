
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamTown - Game</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f8ff;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    .stat {
      font-size: 18px;
      margin: 10px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Selamat datang ke DreamTown!</h1>

  <div class="stat">XP: <span id="xp">0</span></div>
  <div class="stat">Duit: <span id="money">0</span></div>
  <div class="stat">Level: <span id="level">1</span></div>

  <button id="gainXpBtn">Tambah XP</button>
  <button id="earnMoneyBtn">Tambah Duit</button>

  <script type="module" src="src/js/game.js"></script>

</html>
