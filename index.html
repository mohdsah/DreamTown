<!DOCTYPE html><html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamTown - Game</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f8ff;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    .stat {
      font-size: 18px;
      margin: 10px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Selamat datang ke DreamTown!</h1>  <div class="stat">XP: <span id="xp">0</span></div>
  <div class="stat">Duit: <span id="money">0</span></div>
  <div class="stat">Level: <span id="level">1</span></div><button id="gainXpBtn">Tambah XP</button> <button id="earnMoneyBtn">Tambah Duit</button>

  <hr>  <h2>Farming & Resources</h2>
  <button id="farmPadiBtn">Tani Padi +5</button>
  <button id="farmSayurBtn">Tani Sayur +5</button>
  <button id="collectKayuBtn">Kumpul Kayu +5</button>
  <button id="findKristalBtn">Cari Kristal +1</button><br><br> <button id="upgradeBtn">Upgrade Bangunan (RM500)</button>

  <h3>Quest Harian:</h3>
  <ul id="questList"></ul>  <script type="module" src="main.js"></script></body>
</html>
