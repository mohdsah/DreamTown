<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamTown Admin Panel</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="src/admin/css/admin-style.css"> <!-- Tambahan jika mahu style khas admin -->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #dbeafe, #e0f7fa);
      margin: 0;
      padding: 40px;
    }

    .admin-container {
      max-width: 900px;
      margin: auto;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 16px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #3b82f6;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .actions button {
      margin-right: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .edit-btn {
      background-color: #10b981;
      color: white;
    }

    .delete-btn {
      background-color: #ef4444;
      color: white;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <h2>DreamTown Admin Panel</h2>
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>XP</th>
          <th>Duit</th>
          <th>Level</th>
          <th>Tindakan</th>
        </tr>
      </thead>
      <tbody id="playerTable">
        <!-- Data pemain akan dijana di sini oleh JS -->
      </tbody>
    </table>
  </div>

  <!-- JS -->
  <script type="module" src="src/js/admin/admin.js"></script>
</body>
</html>
