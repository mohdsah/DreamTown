<!DOCTYPE html>
<html>
<head>
  <title>Login - DreamTown</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABbbqTjJ0AQUlOVzv6SJtnjUCAWKjnQK8",
      authDomain: "dreamtowndemo.firebaseapp.com",
      projectId: "dreamtowndemo",
      storageBucket: "dreamtowndemo.firebasestorage.app",
      messagingSenderId: "388188231244",
      appId: "1:388188231244:web:c76651908a0c14f0ee06e9",
      measurementId: "G-YY3JMP7L13"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          window.location.href = "main.html";
        })
        .catch(err => alert("Login failed: " + err.message));
    };

    window.register = function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      createUserWithEmailAndPassword(auth, email, password)
        .then(() => {
          alert("Akaun berjaya didaftarkan!");
        })
        .catch(err => alert("Pendaftaran gagal: " + err.message));
    };
  </script>
</head>
<body>
  <h2>Login DreamTown</h2>
  <input id="email" type="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>
  <button onclick="register()">Daftar</button>
</body>
</html>
