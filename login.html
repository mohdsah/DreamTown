
<!DOCTYPE html>
<html>
<head>
  <title>DreamTown Login</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDh9xsa3bq8CS64M7tKRM8qp5izAky08qU",
      authDomain: "hiburan-geminifm.firebaseapp.com",
      projectId: "hiburan-geminifm",
      storageBucket: "hiburan-geminifm.firebasestorage.app",
      messagingSenderId: "195271406655",
      appId: "1:195271406655:web:bbb370d7f96980fe98f48a",
      measurementId: "G-77WP1B9ZF3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function startGame() {
      const name = document.getElementById("username").value.trim();
      if (!name) return alert("Sila masukkan nama");

      const playerRef = doc(db, "players", name);
      const docSnap = await getDoc(playerRef);

      if (docSnap.exists()) {
        alert("Selamat kembali, " + name + "!");
      } else {
        await setDoc(playerRef, {
          name: name,
          money: 1000,
          level: 1,
          inventory: {
            Padi: 0,
            Sayur: 0,
            Kayu: 0,
            Kristal: 0
          }
        });
        alert("Akaun baru dibuat!");
      }

      window.location.href = "dreamtown.html?user=" + encodeURIComponent(name);
    }
  </script>
</head>
<body style="text-align:center;padding:50px;font-family:sans-serif;">
  <h1>DreamTown</h1>
  <p>Masukkan nama anda untuk mula:</p>
  <input type="text" id="username" placeholder="Nama anda" />
  <br><br>
  <button onclick="startGame()">Start</button>
</body>
</html>
